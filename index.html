<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Toko Hijau</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
        
        body { 
            background: #f0fff4; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }

        /* LOGIN PAGE */
        .login-box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,128,0,0.2);
            width: 90%;
            max-width: 350px;
            text-align: center;
            border-top: 5px solid #2ecc71;
        }
        .login-box h2 { color: #27ae60; margin-bottom: 20px; }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }
        .login-box input:focus { border-color: #2ecc71; }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-box button:hover { background: #27ae60; }
        .error { color: red; font-size: 13px; margin-top: 5px; display: none; }

        /* DASHBOARD / MENU PAGE */
        .dashboard { 
            display: none; 
            width: 100%; 
            height: 100vh; 
            background: #f0fff4;
        }
        .navbar {
            background: #2ecc71;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar button {
            background: white;
            color: #2ecc71;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .container { padding: 20px; }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .menu-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.3s;
        }
        .menu-card:hover {
            border-color: #2ecc71;
            transform: translateY(-3px);
        }
        .menu-card h3 { color: #27ae60; margin-bottom: 8px; }
        .content-area {
            background: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            min-height: 200px;
            border-left: 5px solid #2ecc71;
        }

        @media (min-width: 700px) {
            .menu-grid { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div class="login-box" id="loginPage">
        <h2>🍃 Masuk ke Toko Hijau</h2>
        <input type="text" id="username" placeholder="Username" value="admin">
        <input type="password" id="password" placeholder="Password" value="123">
        <button onclick="login()">Masuk</button>
        <p class="error" id="errorMsg">Username/Password salah!</p>
        <p style="font-size:12px; color:#777; margin-top:10px;">Demo: admin / 123</p>
    </div>

    <!-- HALAMAN DASHBOARD / MENU -->
    <div class="dashboard" id="dashboardPage">
        <div class="navbar">
            <h2>Toko Hijau Seller</h2>
            <button onclick="logout()">Keluar</button>
        </div>
        
        <div class="container">
            <h3 style="color:#27ae60; margin-bottom:15px;">Menu Utama</h3>
            
            <div class="menu-grid">
                <div class="menu-card" onclick="showContent('produk')">
                    <h3>📦 Produk</h3>
                    <p>Kelola Produk</p>
                </div>
                <div class="menu-card" onclick="showContent('pesanan')">
                    <h3>📝 Pesanan</h3>
                    <p>Lihat Pesanan</p>
                </div>
                <div class="menu-card" onclick="showContent('keuangan')">
                    <h3>💰 Keuangan</h3>
                    <p>Mutasi & Saldo</p>
                </div>
                <div class="menu-card" onclick="showContent('laporan')">
                    <h3>📊 Laporan</h3>
                    <p>Statistik Penjualan</p>
                </div>
            </div>

            <div class="content-area" id="contentArea">
                <h3>Selamat Datang!</h3>
                <p>Silahkan pilih menu di atas untuk melihat detailnya.</p>
            </div>
        </div>
    </div>

    <script>
        // Fungsi Login
        function login() {
            let user = document.getElementById('username').value;
            let pass = document.getElementById('password').value;
            let error = document.getElementById('errorMsg');

            if(user === 'admin' && pass === '123') {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('dashboardPage').style.display = 'block';
                error.style.display = 'none';
            } else {
                error.style.display = 'block';
            }
        }

        // Fungsi Logout
        function logout() {
            document.getElementById('dashboardPage').style.display = 'none';
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // Fungsi Interaksi Menu
        function showContent(menu) {
            let area = document.getElementById('contentArea');
            if(menu === 'produk') {
                area.innerHTML = '<h3>📦 Kelola Produk</h3><p>Di sini kamu bisa tambah, edit, dan hapus produk jualan.</p><button style="padding:8px 15px; background:#2ecc71; color:white; border:none; border-radius:5px; cursor:pointer;">+ Tambah Produk</button>';
            }
            if(menu === 'pesanan') {
                area.innerHTML = '<h3>📝 Daftar Pesanan</h3><p>1. #ORD001 - Budi - Rp150.000 - <b style="color:orange;">Menunggu Bayar</b></p><p>2. #ORD002 - Siti - Rp220.000 - <b style="color:green;">Selesai</b></p>';
            }
            if(menu === 'keuangan') {
                area.innerHTML = '<h3>💰 Keuangan</h3><p>Saldo Toko: <b style="color:#27ae60;">Rp 2.500.000</b></p><p>Pendapatan Bulan Ini: Rp 8.400.000</p>';
            }
            if(menu === 'laporan') {
                area.innerHTML = '<h3>📊 Laporan Penjualan</h3><p>Total Penjualan: 120 Produk</p><p>Produk Terlaris: Kaos Hijau</p>';
            }
        }

        // Enter untuk login
        document.addEventListener('keypress', function(e) {
            if(e.key === 'Enter') login();
        });
    </script>
</body>
</html>
