<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokoHijau - Belanja</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #0d0d0d;
            color: #fff;
            padding-bottom: 70px;
        }
        .hidden { display: none !important; }
        .sticky-top { position: sticky; top: 0; z-index: 99; background: #1a1a1a; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; padding: 12px; }
        .product-card { background: #1e1e1e; border-radius: 10px; overflow: hidden; position: relative; }
        .product-img { width: 100%; height: 140px; object-fit: cover; background: #333; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .product-info { padding: 10px; }
        .price-old { text-decoration: line-through; color: #888; font-size: 12px; }
        .price-new { color: #ff4d4f; font-weight: bold; font-size: 16px; }
        .badge-sale { position: absolute; top: 8px; right: 8px; background: #ff4d4f; color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #333; }
        .bottom-nav button { background: none; border: none; color: #aaa; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
        .bottom-nav button.active { color: #ff4d4f; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 99; display: none; }
        .overlay.show { display: block; }
        .modal { position: fixed; bottom: 0; left: 0; right: 0; background: #1e1e1e; border-radius: 16px 16px 0 0; padding: 20px; z-index: 101; transform: translateY(100%); transition: 0.3s; max-height: 85vh; overflow-y: auto; }
        .modal.show { transform: translateY(0); }
        input, select, textarea { width: 100%; padding: 10px; margin: 6px 0 12px; background: #2a2a2a; border: none; border-radius: 6px; color: #fff; font-size: 14px; }
        button.btn { background: #ff4d4f; color: #fff; border: none; padding: 10px 14px; border-radius: 6px; font-weight: 500; cursor: pointer; font-size: 14px; }
        button.btn-outline { background: transparent; border: 1px solid #ff4d4f; color: #ff4d4f; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .cart-badge { position: absolute; top: -6px; right: -6px; background: #ff4d4f; color: #fff; font-size: 10px; min-width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .back-btn { position: absolute; left: 12px; top: 12px; background: #333; border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .header-top { position: relative; padding: 12px; text-align: center; background: #1a1a1a; }
        label { font-size: 13px; color: #ccc; }
    </style>
</head>
<body>

<!-- Overlay Modal -->
<div class="overlay" id="modal-overlay" onclick="closeModal()"></div>

<!-- ================================== HALAMAN BERANDA ================================== -->
<div id="page-home">
    <div class="sticky-top">
        <div class="p-3 flex justify-between items-center">
            <h1 class="text-lg font-bold text-red-500">🍃 TokoHijau</h1>
            <div class="relative">
                <button class="text-xl" onclick="openCart()">🛒</button>
                <span class="cart-badge" id="cart-count">0</span>
            </div>
        </div>
        <div class="px-3 pb-3">
            <input type="text" id="search" placeholder="Cari produk..." class="!m-0" oninput="renderProducts()">
        </div>
    </div>
    <div id="product-list" class="product-grid"></div>
    <div class="bottom-nav">
        <button class="active" onclick="showPage('home')">🏠 Beranda</button>
        <button onclick="showPage('sale')">🔥 Flash Sale</button>
        <button onclick="openCart()">🛒 Keranjang</button>
        <button onclick="goToAdmin()">⚙️ Admin</button>
    </div>
</div>

<!-- ================================== HALAMAN FLASH SALE ================================== -->
<div id="page-sale" class="hidden">
    <div class="sticky-top header-top">
        <button class="back-btn" onclick="showPage('home')">←</button>
        <h2 class="font-bold">🔥 Flash Sale</h2>
    </div>
    <div id="sale-list" class="product-grid"></div>
    <div class="bottom-nav">
        <button onclick="showPage('home')">🏠 Beranda</button>
        <button class="active">🔥 Flash Sale</button>
        <button onclick="openCart()">🛒 Keranjang</button>
        <button onclick="goToAdmin()">⚙️ Admin</button>
    </div>
</div>

<!-- ================================== HALAMAN DETAIL PRODUK ================================== -->
<div id="page-detail" class="hidden">
    <div class="sticky-top header-top">
        <button class="back-btn" onclick="showPage('home')">←</button>
        <h2 class="font-bold">Detail Produk</h2>
    </div>
    <div id="detail-content" class="p-4"></div>
</div>

<!-- ================================== HALAMAN KERANJANG ================================== -->
<div id="page-cart" class="hidden">
    <div class="sticky-top header-top">
        <button class="back-btn" onclick="showPage('home')">←</button>
        <h2 class="font-bold">Keranjang Belanja</h2>
    </div>
    <div id="cart-list" class="p-4"></div>
    <div class="fixed bottom-16 left-0 right-0 p-4 bg-[#1a1a1a] border-t border-gray-700">
        <div class="flex justify-between mb-3">
            <span class="font-medium">Total Pembayaran:</span>
            <span class="font-bold text-red-500 text-lg" id="cart-total">Rp0</span>
        </div>
        <button class="btn w-full" onclick="checkout()">✅ Checkout Sekarang</button>
    </div>
</div>

<!-- ================================== MODAL PILIHAN BELI ================================== -->
<div class="modal" id="buy-modal">
    <h3 class="font-bold mb-3" id="modal-prod-name"></h3>
    <label>Jumlah</label>
    <input type="number" id="buy-qty" value="1" min="1" class="!m-0">
    <label>Ukuran</label>
    <select id="buy-size"></select>
    <label>Warna</label>
    <select id="buy-color"></select>
    <div class="flex gap-2 mt-4">
        <button class="btn flex-1" onclick="confirmBuy()">✅ Beli Sekarang</button>
        <button class="btn-outline flex-1" onclick="confirmAddCart()">🛒 Masukkan Keranjang</button>
    </div>
    <button class="w-full mt-3 text-gray-400" onclick="closeModal()">Tutup</button>
</div>

<script>
// === AMBIL DATA PRODUK DARI PENYIMPANAN ===
function getProducts() {
    return JSON.parse(localStorage.getItem('produk_data')) || [
        { id:1, nama:"Kaos Polos", harga:100000, promo:75000, ukuran:"S,M,L,XL", warna:"Hitam,Putih,Merah", desk:"Kaos polos bahan katun nyaman dipakai sehari-hari." },
        { id:2, nama:"Celana Jeans", harga:250000, promo:190000, ukuran:"28,29,30,31,32", warna:"Biru Tua,Biru Muda,Hitam", desk:"Celana jeans berkualitas, awet dan nyaman dipakai." },
        { id:3, nama:"Topi Baseball", harga:80000, promo:0, ukuran:"Sekali Ukuran", warna:"Hitam,Putih,Merah", desk:"Topi baseball nyaman dipakai, melindungi dari matahari." }
    ];
}
function saveCart() {
    localStorage.setItem('keranjang_data', JSON.stringify(cart));
}
let cart = JSON.parse(localStorage.getItem('keranjang_data')) || [];
let currentDetail = null;

// === PINDAH HALAMAN ===
function showPage(pageId){
    document.querySelectorAll('#page-home, #page-sale, #page-detail, #page-cart').forEach(el=>el.classList.add('hidden'));
    document.getElementById('page-'+pageId).classList.remove('hidden');
    if(pageId==='home') { renderProducts(); updateCartBadge(); }
    if(pageId==='sale') renderSaleProducts();
    if(pageId==='cart') renderCart();
}

// === PINDAH KE HALAMAN ADMIN ===
function goToAdmin() {
    window.location.href = 'admin.html';
}

// === TAMPILKAN DAFTAR PRODUK ===
function renderProducts(){
    let products = getProducts();
    let q = document.getElementById('search').value.toLowerCase();
    let list = products.filter(p=>p.nama.toLowerCase().includes(q));
    let html = '';
    list.forEach(p=>{
        let isSale = p.promo && p.promo>0;
        html += `
        <div class="product-card">
            ${isSale?'<span class="badge-sale">SALE</span>':''}
            <div class="product-img">📷</div>
            <div class="product-info">
                <h4 class="text-sm font-medium truncate">${p.nama}</h4>
                ${isSale?`<span class="price-old">Rp${p.harga.toLocaleString()}</span>`:' '}
                <p class="price-new">Rp${(isSale?p.promo:p.harga).toLocaleString()}</p>
                <button class="btn w-full text-xs mt-2 py-1" onclick="openDetail(${p.id})">🔍 Lihat Detail</button>
            </div>
        </div>`;
    });
    document.getElementById('product-list').innerHTML = html;
}

// === TAMPILKAN FLASH SALE ===
function renderSaleProducts(){
    let products = getProducts();
    let saleItems = products.filter(p=>p.promo && p.promo>0);
    let html = '';
    saleItems.forEach(p=>{
        html += `
        <div class="product-card">
            <span class="badge-sale">SALE</span>
            <div class="product-img">📷</div>
            <div class="product-info">
                <h4 class="text-sm font-medium">${p.nama}</h4>
                <span class="price-old">Rp${p.harga.toLocaleString()}</span>
                <p class="price-new">Rp${p.promo.toLocaleString()}</p>
                <button class="btn w-full text-xs mt-2 py-1" onclick="openDetail(${p.id})">🔍 Lihat Detail</button>
            </div>
        </div>`;
    });
    document.getElementById('sale-list').innerHTML = html || '<p class="text-center text-gray-400 col-span-2 py-8">Tidak ada produk diskon saat ini.</p>';
}

// === BUKA HALAMAN DETAIL PRODUK ===
function openDetail(id){
    let products = getProducts();
    currentDetail = products.find(p=>p.id===id);
    if(!currentDetail) return;
    let p = currentDetail;
    let isSale = p.promo && p.promo>0;
    document.getElementById('detail-content').innerHTML = `
        <div class="bg-gray-800 rounded-lg h-52 flex items-center justify-center text-5xl mb-4">📷</div>
        <h2 class="text-xl font-bold mb-2">${p.nama}</h2>
        ${isSale?`<p class="price-old text-lg">Harga Normal: Rp${p.harga.toLocaleString()}</p>`:''}
        <p class="text-2xl font-bold text-red-500 mb-3">Rp${(isSale?p.promo:p.harga).toLocaleString()}</p>
        <p class="text-gray-300 mb-5 leading-relaxed">${p.desk}</p>
        <div class="flex gap-3">
            <button class="btn flex-1" onclick="openBuyModal(${p.id})">✅ Beli Sekarang</button>
            <button class="btn-outline flex-1" onclick="quickAddCart(${p.id})">🛒 Keranjang</button>
        </div>
    `;
    showPage('detail');
}

// === BUKA MODAL PILIHAN BELI ===
function openBuyModal(id){
    let products = getProducts();
    currentDetail = products.find(p=>p.id===id);
    if(!currentDetail) return;
    document.getElementById('modal-prod-name').textContent = currentDetail.nama;
    document.getElementById('buy-qty').value = 1;
    let sizes = currentDetail.ukuran.split(',').map(s=>s.trim());
    let colors = currentDetail.warna.split(',').map(c=>c.trim());
    document.getElementById('buy-size').innerHTML = sizes.map(s=>`<option value="${s}">${s}</option>`).join('');
    document.getElementById('buy-color').innerHTML = colors.map(c=>`<option value="${c}">${c}</option>`).join('');
    document.getElementById('modal-overlay').classList.add('show');
    document.getElementById('buy-modal').classList.add('show');
}
function closeModal(){
    document.getElementById('modal-overlay').classList.remove('show');
    document.getElementById('buy-modal').classList.remove('show');
}

// === TAMBAH KE KERANJANG DENGAN PILIHAN ===
function confirmAddCart(){
    if(!currentDetail) return;
    let qty = parseInt(document.getElementById('buy-qty').value)||1;
    let size = document.getElementById('buy-size').value;
    let color = document.getElementById('buy-color').value;
    addToCart(currentDetail.id, qty, size, color);
    closeModal();
    alert('✅ Berhasil dimasukkan ke keranjang!');
}

// === KONFIRMASI BELI SEKARANG ===
function confirmBuy(){
    if(!currentDetail) return;
    let qty = parseInt(document.getElementById('buy-qty').value)||1;
    let size = document.getElementById('buy-size').value;
    let color = document.getElementById('buy-color').value;
    let price = (currentDetail.promo&&currentDetail.promo>0)?currentDetail.promo:currentDetail.harga;
    alert(`✅ Terima kasih!\n\nProduk: ${currentDetail.nama}\nJumlah: ${qty}\nUkuran: ${size}\nWarna: ${color}\nTotal: Rp${(price*qty).toLocaleString()}`);
    closeModal();
}

// === TAMBAH KERANJANG CEPAT ===
function quickAddCart(id){
    let products = getProducts();
    let prod = products.find(p=>p.id===id);
    if(!prod) return;
    let sizes = prod.ukuran.split(',').map(s=>s.trim());
    let colors = prod.warna.split(',').map(c=>c.trim());
    addToCart(id, 1, sizes[0], colors[0]);
    alert('✅ Berhasil dimasukkan ke keranjang!');
}

// === FUNGSI KERANJANG ===
function addToCart(id, qty, size, color){
    let products = getProducts();
    let prod = products.find(p=>p.id===id);
    if(!prod) return;
    let price = (prod.promo&&prod.promo>0)?prod.promo:prod.harga;
    let idx = cart.findIndex(c=>c.id===id && c.ukuran===size && c.warna===color);
    if(idx>=0) cart[idx].qty += qty;
    else cart.push({id, nama:prod.nama, harga:price, qty, ukuran:size, warna:color});
    saveCart();
    updateCartBadge();
}
function updateCartBadge(){
    let total = cart.reduce((s,i)=>s+i.qty,0);
    document.getElementById('cart-count').textContent = total;
}
function openCart(){ showPage('cart'); }
function renderCart(){
    let html = ''; let totalAll = 0;
    cart.forEach((item,idx)=>{
        let total = item.harga * item.qty;
        totalAll += total;
        html += `
        <div class="bg-gray-800 p-3 rounded-lg mb-2">
            <h4 class="font-medium">${item.nama}</h4>
            <p class="text-sm text-gray-400">${item.warna} / ${item.ukuran}</p>
            <p>Harga: Rp${item.harga.toLocaleString()} × ${item.qty} = <b>Rp${total.toLocaleString()}</b></p>
            <button class="text-red-400 text-sm mt-1" onclick="removeCart(${idx})">🗑️ Hapus dari keranjang</button>
        </div>`;
    });
    document.getElementById('cart-list').innerHTML = html || '<p class="text-center text-gray-400 py-8">🛒 Keranjang masih kosong, silakan belanja.</p>';
    document.getElementById('cart-total').textContent = 'Rp'+totalAll.toLocaleString();
}
function removeCart(idx){
    cart.splice(idx,1);
    saveCart();
    renderCart();
    updateCartBadge();
}
function checkout(){
    if(cart.length===0) return alert('❌ Keranjang masih kosong!');
    openBuyModal(cart[0].id);
}

// === SAAT PERTAMA DIBUKA ===
renderProducts();
updateCartBadge();
</script>
</body>
</html>
