<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TokoKu - Dashboard Penjual</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        
        body { background: #f5f5f5; }
        
        /* Navbar */
        .navbar {
            background: #ff5722;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h2 { font-size: 20px; }
        
        /* Container */
        .container { padding: 20px; }
        
        /* Card Statistik */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }
        .card h3 { font-size: 14px; color: #777; margin-bottom: 5px; }
        .card p { font-size: 22px; font-weight: bold; color: #ff5722; }
        
        /* Menu Cepat */
        .menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .menu-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .menu-item:hover { background: #fff3e0; }
        
        /* Tabel Pesanan */
        .orders {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .orders h3 { margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #fafafa; }
        .status { padding: 5px 10px; border-radius: 5px; font-size: 12px; }
        .status.baru { background: #ffe0b2; color: #e65100; }
        .status.kirim { background: #c8e6c9; color: #2e7d32; }
        
        /* Responsive HP */
        @media (max-width: 600px) {
            .stats { grid-template-columns: 1fr; }
            .menu { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <h2>TokoKu Seller</h2>
        <span>Halo, Pak Wahab 👋</span>
    </div>

    <div class="container">
        <!-- Statistik -->
        <div class="stats">
            <div class="card">
                <h3>Pesanan Baru</h3>
                <p>12</p>
            </div>
            <div class="card">
                <h3>Penjualan Hari Ini</h3>
                <p>Rp 2.450.000</p>
            </div>
            <div class="card">
                <h3>Produk Aktif</h3>
                <p>48</p>
            </div>
        </div>

        <!-- Menu Cepat -->
        <div class="menu">
            <div class="menu-item">📦 Kelola Produk</div>
            <div class="menu-item">📝 Pesanan</div>
            <div class="menu-item">💰 Keuangan</div>
            <div class="menu-item">📊 Laporan</div>
        </div>

        <!-- Tabel Pesanan Masuk -->
        <div class="orders">
            <h3>Pesanan Terbaru</h3>
            <table>
                <tr>
                    <th>No Pesanan</th>
                    <th>Pembeli</th>
                    <th>Total</th>
                    <th>Status</th>
                </tr>
                <tr>
                    <td>#ORD001</td>
                    <td>Budi Santoso</td>
                    <td>Rp 250.000</td>
                    <td><span class="status baru">Baru</span></td>
                </tr>
                <tr>
                    <td>#ORD002</td>
                    <td>Siti Aminah</td>
                    <td>Rp 180.000</td>
                    <td><span class="status kirim">Dikirim</span></td>
                </tr>
                <tr>
                    <td>#ORD003</td
