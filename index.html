<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HijauShop - Jual Beli Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      .hijau-bg { background-color: #2ecc71; }
      .hijau-text { color: #2ecc71; }
      .hijau-border { border-color: #2ecc71; }
      .hijau-gelap { background-color: #27ae60; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Top Bar Navigation -->
    <div class="hijau-bg text-white text-xs py-1 border-b border-green-400">
        <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
            <div class="flex space-x-4">
                <a href="#" class="hover:opacity-80">Seller Centre</a>
                <span>|</span>
                <a href="#" class="hover:opacity-80">Download Aplikasi</a>
                <span>|</span>
                <a href="#" class="hover:opacity-80">Ikuti Kami di <i class="fa-brands fa-instagram ml-1"></i><i class="fa-brands fa-facebook ml-1"></i></a>
            </div>
            <div class="flex space-x-4 items-center">
                <a href="#" class="hover:opacity-80"><i class="fa-regular fa-bell mr-1"></i> Notifikasi</a>
                <a href="#" class="hover:opacity-80"><i class="fa-regular fa-circle-question mr-1"></i> Bantuan</a>
                <button onclick="toggleAuthModal()" class="font-bold hover:opacity-80">Daftar | Login</button>
            </div>
        </div>
    </div>

    <!-- Main Header / Navbar -->
    <header class="hijau-bg text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-6">
            <a href="#" onclick="filterCategory('all')" class="text-3xl font-extrabold tracking-tight flex items-center gap-2">
                <i class="fa-solid fa-leaf text-4xl"></i> HijauShop
            </a>
            <div class="flex-1 max-w-2xl relative">
                <div class="flex">
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Cari produk segar, murah, dan berkualitas..."
                        class="w-full px-4 py-2 text-sm text-gray-800 rounded-l-sm focus:outline-none">
                    <button onclick="handleSearch()" class="hijau-gelap hover:bg-green-700 px-6 py-2 rounded-r-sm font-bold transition">
                        <i class="fa-solid fa-magnifying-glass text-white"></i>
                    </button>
                </div>
                <div class="flex space-x-3 text-xs mt-1 text-green-100 hidden sm:flex">
                    <a href="#" onclick="quickSearch('Kemeja')" class="hover:underline">Kemeja Wanita</a>
                    <a href="#" onclick="quickSearch('Headphone')" class="hover:underline">Headphone Bluetooth</a>
                    <a href="#" onclick="quickSearch('Sepatu')" class="hover:underline">Sneakers Putih</a>
                </div>
            </div>
            <button onclick="toggleCartModal()" class="relative p-2 text-white hover:opacity-90 transition">
                <i class="fa-solid fa-cart-shopping text-2xl"></i>
                <span id="cartCount" class="absolute -top-1 -right-1 bg-white text-green-600 text-xs font-extrabold rounded-full h-5 w-5 flex items-center justify-center shadow">0</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-4 w-full flex-grow">

        <!-- Banner + Flash Sale + Kategori sama seperti sebelumnya -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-2 mb-6">
            <div class="md:col-span-2 relative rounded overflow-hidden shadow">
                <img src="https://down-id.img.susercontent.com/file/id-11134207-7qul5-lik586ws4y9615" alt="Banner Utama" class="w-full h-52 object-cover">
                <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/70 to-transparent p-4 text-white">
                    <span class="bg-green-600 text-white text-xs px-2 py-0.5 rounded font-bold">SUPER SALE HIJAU</span>
                    <h2 class="text-xl font-bold mt-1">Diskon s/d 80% + Gratis Ongkir Se-Nusantara</h2>
                </div>
            </div>
        </div>

        <section class="bg-white rounded shadow mb-6 p-4">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <span class="text-green-600 font-extrabold text-xl"><i class="fa-solid fa-bolt text-yellow-400"></i> FLASH SALE</span>
                <a href="#" class="text-xs font-semibold hijau-text hover:underline">Lihat Semua ></a>
            </div>
            <div id="flashSaleGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3"></div>
        </section>

        <!-- Rekomendasi Produk -->
        <section>
            <div class="bg-white p-3 border-b-2 border-green-500 mb-4 inline-block">
                <h3 class="hijau-text font-bold text-sm uppercase tracking-wide">Rekomendasi Untukmu</h3>
            </div>
            <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2"></div>
        </section>
    </main>

    <!-- Modal sama seperti sebelumnya -->
    <div id="detailModal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-md max-w-lg w-full overflow-hidden shadow-2xl relative">
            <button onclick="closeDetailModal()" class="absolute top-2 right-2 text-gray-500 hover:text-gray-800 bg-gray-100 rounded-full w-8 h-8 flex items-center justify-center z-10"><i class="fa-solid fa-xmark"></i></button>
            <div class="flex flex-col sm:flex-row">
                <img id="modalImg" src="" alt="" class="w-full sm:w-1/2 h-56 sm:h-auto object-cover">
                <div class="p-4 flex-col justify-between sm:w-1/2">
                    <div>
                        <span class="bg-green-500 text-white text-[10px] px-1.5 py-0.5 rounded font-bold">Star+</span>
                        <h3 id="modalTitle" class="text-base font-bold text-gray-800 mt-1"></h3>
                        <p id="modalPrice" class="text-xl font-bold hijau-text mt-2"></p>
                        <p id="modalDesc" class="text-gray-500 text-xs mt-2"></p>
                    </div>
                    <button id="modalAddBtn" class="mt-4 w-full hijau-bg text-white py-2 rounded text-sm font-bold">+ Keranjang</button>
                </div>
            </div>
        </div>
    </div>

    <div id="cartModal" class="fixed inset-0 bg-black/60 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col justify-between p-4">
            <div>
                <div class="flex justify-between items-center border-b pb-3 mb-3">
                    <h3 class="text-base font-bold">Keranjang Saya</h3>
                    <button onclick="toggleCartModal()" class="text-gray-500"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="cartItems" class="space-y-3 max-h-[70vh] overflow-y-auto"></div>
            </div>
            <div class="border-t pt-3">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-xs text-gray-600">Total Harga:</span>
                    <span id="cartTotal" class="text-lg font-bold hijau-text">Rp 0</span>
                </div>
                <button onclick="checkout()" class="w-full hijau-bg text-white py-2.5 rounded text-sm font-bold">Checkout Sekarang</button>
            </div>
        </div>
    </div>

    <script>
        // TAMBAH 10 PRODUK BARU DI SINI
        const products = [
            {id: 1, name: "Kemeja Blouse Wanita Casual Korean Style", category: "Pakaian", price: 79000, discount: "30%", rating: 4.8, sold: "2,4rb", location: "Kab. Bandung", image: "https://down-id.img.susercontent.com/file/id-11134207-7qul5-lik586ws4y9615", desc: "Atasan blouse wanita casual lengan pendek crinkle airflow halus & adem."},
            {id: 2, name: "Headphone Bluetooth Gaming Wireless Over Ear Extra Bass", category: "Elektronik", price: 189000, discount: "50%", rating: 4.9, sold: "5,1rb", location: "Jakarta Barat", image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400", desc: "Headphone Bluetooth v5.3 kualitas bass mantap, baterai tahan 30 jam."},
            {id: 3, name: "Sneakers Wanita/Pria Sports Running Shoes Trendy White", category: "Sepatu", price: 135000, discount: "40%", rating: 4.7, sold: "1,8rb", location: "Kota Tangerang", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400", desc: "Sepatu sneakers putih olah raga modis, sol tinggi empuk."},
            {id: 4, name: "Tas Ransel Wanita Import Korea Canvas Backpack Fashion", category: "Aksesoris", price: 98000, discount: "25%", rating: 4.8, sold: "950", location: "Jakarta Utara", image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400", desc: "Tas ransel multifungsi cocok untuk sekolah, kuliah."},
            {id: 5, name: "Jam Tangan Pria Sporty Elegan Leather Strap Water Resistant", category: "Aksesoris", price: 165000, discount: "35%", rating: 4.9, sold: "3,3rb", location: "Kota Medan", image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400", desc: "Jam tangan analog pria dengan tali kulit sintetis."},
            {id: 6, name: "Serum Wajah Glowing Moisturizer Gel 30ml Hydra Lock", category: "Kecantikan", price: 59000, discount: "20%", rating: 4.9, sold: "10rb+", location: "Surabaya", image: "https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?w=400", desc: "Serum brightening mencerahkan kulit kusam."},

            // 10 PRODUK BARU
            {id: 7, name: "Celana Jeans Pria Slimfit Stretch Premium", category: "Pakaian", price: 149000, discount: "45%", rating: 4.8, sold: "3,2rb", location: "Bandung", image: "https://images.unsplash.com/photo-1542272604-787c3835535d?w=400", desc: "Celana jeans slimfit bahan stretch nyaman dipakai seharian."},
            {id: 8, name: "Keyboard Mechanical RGB Gaming 60%", category: "Elektronik", price: 350000, discount: "30%", rating: 4.9, sold: "1,5rb", location: "Jakarta", image: "https://images.unsplash.com/photo-1541140532154-b024d705b90a?w=400", desc: "Keyboard mechanical switch blue, lampu RGB 16 juta warna."},
            {id: 9, name: "Hoodie Zipper Pria Wanita Fleece Tebal", category: "Pakaian", price: 120000, discount: "25%", rating: 4.7, sold: "4,1rb", location: "Solo", image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=400", desc: "Hoodie bahan fleece tebal dan lembut, cocok untuk cuaca dingin."},
            {id: 10, name: "Sepatu Lari Wanita Air Zoom Cushion", category: "Sepatu", price: 299000, discount: "50%", rating: 4.9, sold: "2,7rb", location: "Semarang", image: "https://images.unsplash.com/photo-1460353581641-37baddab0fa2?w=400", desc: "Sepatu lari dengan teknologi cushioning empuk dan ringan."},
            {id: 11, name: "Smartwatch GT5 Pro Layar AMOLED", category: "Elektronik", price: 850000, discount: "20%", rating: 4.8, sold: "890", location: "Jakarta Selatan", image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400", desc: "Smartwatch dengan fitur kesehatan lengkap dan baterai 14 hari."},
            {id: 12, name: "Lipstik Matte Tahan 24 Jam", category: "Kecantikan", price: 45000, discount: "15%", rating: 4.8, sold: "12rb+", location: "Surabaya", image: "https://images.unsplash.com/photo-1586495777744-4413f9150c3d?w=400", desc: "Lipstik matte dengan 12 pilihan warna, tidak transfer."},
            {id: 13, name: "Tas Selempang Pria Kulit Sintetis", category: "Aksesoris", price: 110000, discount: "35%", rating: 4.6, sold: "1,2rb", location: "Yogyakarta", image: "https://images.unsplash.com/photo-1591561954557-26941169b49e?w=400", desc: "Tas selempang casual untuk kerja dan jalan-jalan."},
            {id: 14, name: "Sendal Slop Pria Wanita Anti Slip", category: "Sepatu", price: 35000, discount: "40%", rating: 4.5, sold: "8,5rb", location: "Tangerang", image: "https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=400", desc: "Sendal rumah nyaman, sol karet anti slip."},
            {id: 15, name: "Face Wash Brightening 100ml", category: "Kecantikan", price: 38000, discount: "22%", rating: 4.9, sold: "15rb+", location: "Bekasi", image: "https://images.unsplash.com/photo-1556228720-195a672e8a03?w=400", desc: "Facial wash untuk kulit kusam dan berjerawat."},
            {id: 16, name: "Mouse Wireless Silent Click", category: "Elektronik", price: 75000, discount: "30%", rating: 4.7, sold: "3,8rb", location: "Depok", image: "https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=400", desc: "Mouse wireless tanpa suara, baterai tahan 1 tahun."}
        ];

        let cart = []; let activeCategory = 'all';

        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        }

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            if(items.length === 0) { grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">Produk tidak ditemukan.</p>`; return; }
            items.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white border hover:border-green-500 rounded-sm shadow-sm hover:shadow-md transition cursor-pointer relative" onclick="openDetailModal(${p.id})">
                        <div class="absolute top-0 right-0 bg-yellow-400 text-green-600 text-[10px] font-bold px-1.5 py-0.5 z-10 text-center leading-tight">
                            <span>${p.discount}</span><br><span class="text-white text-[9px] uppercase">OFF</span>
                        </div>
                        <div class="h-36 overflow-hidden bg-gray-100 relative">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover hover:scale-105 transition">
                            <span class="absolute bottom-1 left-1 bg-green-600 text-white text-[9px] px-1 rounded font-bold">Star+</span>
                        </div>
                        <div class="p-2">
                            <h4 class="text-xs text-gray-800 line-clamp-2">${p.name}</h4>
                            <span class="text-sm font-bold hijau-text">${formatRupiah(p.price)}</span>
                            <div class="flex justify-between text-[10px] text-gray-400 mt-1">
                                <span>⭐${p.rating}</span><span>${p.sold} Terjual</span>
                            </div>
                            <p class="text-[10px] text-gray-400"><i class="fa-solid fa-location-dot"></i> ${p.location}</p>
                        </div>
                    </div>`;
            });
        }

        function renderFlashSale() {
            const container = document.getElementById('flashSaleGrid');
            container.innerHTML = '';
            products.slice(0, 6).forEach(p => {
                container.innerHTML += `
                    <div onclick="openDetailModal(${p.id})" class="cursor-pointer text-center">
                        <div class="h-28 bg-gray-100 relative mb-1 overflow-hidden">
                            <img src="${p.image}" class="w-full h-full object-cover hover:scale-105 transition">
                            <span class="absolute top-0 right-0 bg-green-600 text-white text-[9px] font-bold px-1">FLASH</span>
                        </div>
                        <p class="text-sm font-bold hijau-text">${formatRupiah(p.price * 0.8)}</p>
                        <div class="w-full bg-green-100 h-3 rounded-full overflow-hidden mt-1"><div class="bg-green-500 h-full w-3/4"></div></div>
                    </div>`;
            });
        }

        function filterCategory(cat) { activeCategory = cat; const filtered = cat === 'all'? products : products.filter(p => p.category === cat); renderProducts(filtered); }
        function handleSearch() { const query = document.getElementById('searchInput').value.toLowerCase(); const filtered = products.filter(p => (activeCategory === 'all' || p.category === activeCategory) && p.name.toLowerCase().includes(query)); renderProducts(filtered); }
        function quickSearch(keyword) { document.getElementById('searchInput').value = keyword; handleSearch(); }
        function addToCart(id) { const item = products.find(p => p.id === id); const exist = cart.find(c => c.id === id); if(exist) { exist.qty += 1; } else { cart.push({...item, qty: 1}); } updateCartUI(); }
        function removeFromCart(id) { cart = cart.filter(c => c.id!== id); updateCartUI(); }
        function updateCartUI() { const count = cart.reduce((acc, c) => acc + c.qty, 0); const total = cart.reduce((acc, c) => acc + (c.price * c.qty), 0); document.getElementById('cartCount').innerText = count; document.getElementById('cartTotal').innerText = formatRupiah(total); const container = document.getElementById('cartItems'); container.innerHTML = ''; if(cart.length === 0) { container.innerHTML = `<p class="text-center text-gray-400 py-8 text-xs">Keranjang kosong.</p>`; return; } cart.forEach(c => { container.innerHTML += `<div class="flex items-center justify-between border-b pb-2"><img src="${c.image}" class="w-10 h-10 object-cover rounded"><div class="flex-1 ml-2"><h4 class="font-bold text-xs">${c.name}</h4><p class="text-xs hijau-text font-bold">${formatRupiah(c.price)} x ${c.qty}</p></div><button onclick="removeFromCart(${c.id})" class="text-red-500 text-xs p-1"><i class="fa-solid fa-trash"></i></button></div>`; }); }
        function openDetailModal(id) { const p = products.find(prod => prod.id === id); document.getElementById('modalImg').src = p.image; document.getElementById('modalTitle').innerText = p.name; document.getElementById('modalPrice').innerText = formatRupiah(p.price); document.getElementById('modalDesc').innerText = p.desc; document.getElementById('modalAddBtn').onclick = function() { addToCart(p.id); closeDetailModal(); }; document.getElementById('detailModal').classList.remove('hidden'); }
        function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }
        function toggleCartModal() { document.getElementById('cartModal').classList.toggle('hidden'); }
        function toggleAuthModal() { document.getElementById('authModal').classList.toggle('hidden'); }
        function handleAuth(e) { e.preventDefault(); alert("Berhasil masuk akun HijauShop!"); toggleAuthModal(); }
        function checkout() { if(cart.length === 0) { alert("Keranjang kosong!"); return; } alert("Pesanan berhasil! Terima kasih."); cart = []; updateCartUI(); toggleCartModal(); }

        // Init
        renderProducts(products);
        renderFlashSale();
    </script>
</body>
</html>
